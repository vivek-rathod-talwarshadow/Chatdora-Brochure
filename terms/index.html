<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terms of Service | ChatDORA</title>
  <style>
    :root { color-scheme:dark; --bg:#081120; --text:#ecf3f9; --muted:rgba(226,232,240,.75); --accent:#1f8a8a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top,rgba(31,138,138,.2),transparent 30%),var(--bg); color:var(--text); font-family:Arial,sans-serif; }
    .card { width:min(720px,100%); padding:32px; border-radius:24px; background:rgba(13,26,43,.94); border:1px solid rgba(148,163,184,.16); box-shadow:0 24px 60px rgba(0,0,0,.28); }
    h1 { margin:0 0 12px; font-size:clamp(2rem,4vw,3rem); }
    p { margin:0; color:var(--muted); line-height:1.7; font-size:1rem; }
    a { display:inline-block; margin-top:24px; color:white; text-decoration:none; background:var(--accent); padding:12px 20px; border-radius:999px; font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Terms of Service</h1>
    <p>This brochure site is a lightweight public-facing landing page. Update this page later with your final terms of service before production launch.</p>
    <a href="../">Back to homepage</a>
  </main>
</body>
</html>
